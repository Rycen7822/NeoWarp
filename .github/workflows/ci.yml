name: NeoWarp CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bash-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Show shell environment
        run: |
          /bin/bash --version
          env | sort | grep -E '^(BASH|SHELLOPTS|HIST|READLINE|TERM=)' || true
          cat /etc/bash.bashrc /etc/inputrc
      - name: Exercise production bootstrap in a private PTY
        run: |
          python3 - /bin/bash --full <<'PY'
          import fcntl
          import json
          import os
          from pathlib import Path
          import pty
          import re
          import select
          import signal
          import subprocess
          import sys
          import termios
          import time
          
          root = Path(os.environ['GITHUB_WORKSPACE'])
          work = root / '.work/controls/ci-bash-20261116'
          bash = sys.argv[1]
          home = work / 'fresh-home'
          home.mkdir(parents=True, exist_ok=True)
          source = (root / 'app/assets/bundled/bootstrap/bash.sh').read_text()
          functions = source.split(' # This string, after interpolation', 1)[0]
          rc = work / 'probe.rc'
          rc.write_text(functions + '''
          PS1='PROBE> '
          HISTCONTROL=ignorespace
          define_bashpreexec_functions
          preexec() { printf '\\036PREEXEC:%s\\037' "$1"; }
          report_input() { printf '\\036BIND_REPORT\\037'; READLINE_LINE=''; }
          bind -x '"\\C-xp":report_input'
          install_bashpreexec
          ''')
          producer = '--producer' in sys.argv
          if producer:
              body = (root / 'app/assets/bundled/bootstrap/bash_body.sh').read_text()
              names = ('warp_escape_json', 'warp_hex_encode_string', 'warp_send_json_message',
                  'warp_maybe_send_reset_grid_osc', 'warp_agent_launch_environment', 'warp_preexec', 'warp_report_input')
              selected = '\n'.join(re.search(r'^    ' + name + r'\s*\(\).*?^    }', body,
                  re.MULTILINE | re.DOTALL).group() for name in names)
              rc.write_text(functions + '''
          PS1='PROBE> '
          WARP_SESSION_ID=1
          WARP_IN_MSYS2=false
          WARP_USING_WINDOWS_CON_PTY=false
          DCS_START=$'\\eP$'
          DCS_JSON_MARKER=d
          DCS_END=$'\\e\\\\'
          define_bashpreexec_functions
          ''' + selected + '''
          preexec_functions+=(warp_preexec)
          bind -x '"\\C-xp":warp_report_input'
          install_bashpreexec
          ''')
          def preexec_count(data):
              if not producer:
                  return data.count(b'\x1ePREEXEC:')
              hooks = [json.loads(bytes.fromhex(m.group(1).decode())) for m in
                  re.finditer(rb'\x1bP\$d(.*?)\x1b\\', data, re.DOTALL)]
              return sum(h['hook'] == 'Preexec' for h in hooks)
          if '--full' in sys.argv:
              producer = True
              body = (root / 'app/assets/bundled/bootstrap/bash_body.sh').read_text()
              bootstrap = source.replace('#include bundled/bootstrap/bash_body.sh', body)
              rc.write_text('WARP_SESSION_ID=1\nWARP_IN_MSYS2=false\nWARP_USING_WINDOWS_CON_PTY=false\n' + bootstrap + '''
          PS1='PROBE> '
          bind -x '"\\C-xp":warp_report_input'
          probe_ready() { printf '\\036READY\\037'; }
          precmd_functions+=(probe_ready)
          ''')
          master, slave = pty.openpty()
          def attach():
              os.setsid()
              fcntl.ioctl(slave, termios.TIOCSCTTY, 0)
          env = dict(os.environ, HOME=str(home), HISTFILE=str(home / 'history'), TERM='xterm-256color')
          process = subprocess.Popen([bash, '--noprofile', '--rcfile', str(rc), '-i'],
              stdin=slave, stdout=slave, stderr=slave, env=env, preexec_fn=attach)
          os.close(slave)
          def receive(marker):
              data = b''
              deadline = time.monotonic() + 5
              while marker not in data and time.monotonic() < deadline:
                  if select.select([master], [], [], max(0, deadline - time.monotonic()))[0]:
                      data += os.read(master, 65536)
              if marker not in data:
                  raise RuntimeError(repr(data))
              return data
          try:
              ready = b'\x1eREADY\x1f' if '--full' in sys.argv else b'PROBE> '
              initial = receive(ready)
              os.write(master, b"printf 'FIRST\\n'\n")
              before = receive(ready)
              os.write(master, b'typeahead\x18p')
              binding = receive(b'\x1b\\' if producer else b'\x1eBIND_REPORT\x1f')
              os.write(master, b"printf '\\036RESULT:%s\\037\\n' \"${READLINE_LINE+x}\"\n")
              after = receive(b'\x1f\r\n')
              print(json.dumps(dict(bash=bash, before=before.decode(), binding=binding.decode(), after=after.decode())))
              assert preexec_count(before) == 1, 'first command needs preexec'
              assert preexec_count(binding) == 0, 'readline binding must not trigger preexec'
              assert preexec_count(after) == 1, 'command after binding needs preexec'
          finally:
              os.write(master, b'exit\n')
              try:
                  process.wait(timeout=3)
              except subprocess.TimeoutExpired:
                  os.killpg(process.pid, signal.SIGKILL)
                  process.wait()
              os.close(master)
          
          PY
