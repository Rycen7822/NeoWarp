name: Bug Report
description: "Found a bug? Please search through our open issues and docs, to make sure it isn't already submitted. If you have an SSH related issue, please use the SSH Template below"
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: "Pre-submit Checks"
      options:
        - label: "I have [searched NeoWarp bugs](https://github.com/Rycen7822/NeoWarp/issues?q=is%3Aissue+label%3Abug) and there are no duplicates"
          required: true
        - label: "I have [read the NeoWarp README](https://github.com/Rycen7822/NeoWarp/blob/main/README.md) and my issue is not covered there"
          required: true
        - label: "I have included relevant logs, with sensitive details redacted (optional)."
          required: false
  - type: textarea
    id: "describe-the-bug"
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
      placeholder: Tell us what you see.
    validations:
      required: true
  - type: textarea
    id: "to-reproduce"
    attributes:
      label: "To reproduce"
      description: "Bug reports with clear reproduction will get prioritized higher and addressed more quickly."
      placeholder: "Steps to reproduce: 1. Go to '...' 2. Click on '...' 3. Scroll down to '...' 4. See error '...'"
    validations:
      required: true
  - type: textarea
    id: "expected-behavior"
    attributes:
      label: "Expected behavior"
      description: "A clear and concise description of what you expected to happen."
      placeholder: Tell us what you expect to see.
    validations:
      required: false
  - type: textarea
    id: "screenshots-logs"
    attributes:
      label: "Screenshots, videos, and logs"
      description: "If applicable, add screenshots, videos, or logs to explain the problem. Redact sensitive details before posting."
    validations:
      required: false
  - type: dropdown
    id: "os"
    attributes:
      label: "Operating system (OS)"
      multiple: false
      options:
        - "Select an OS"
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: "os-version"
    attributes:
      label: "Operating system and version"
      description: "For example: Debian 11.2"
    validations:
      required: true
  - type: input
    id: "local-shell-version"
    attributes:
      label: "Shell Version"
      description: "For example, `bash 4.0` e.g. Run `bash --version` or `zsh --version`"
    validations:
      required: false
  - type: input
    id: "warp-version"
    attributes:
      label: "Current NeoWarp version"
      description: "Find the version in Settings > About, or run `neowarp --version` with an installed package."
    validations:
      required: false
  - type: dropdown
    id: "regression"
    attributes:
      label: "Regression"
      description: "Is this a regression (used to work in a previous NeoWarp version)?"
      multiple: false
      options:
        - "No, this bug or issue has existed throughout my experience using NeoWarp"
        - "Yes, this bug started recently or with an X NeoWarp version"
    validations:
      required: true
  - type: input
    id: "warp-version-regression-date"
    attributes:
      label: "Recent working NeoWarp date"
      description: "Most recent date that NeoWarp worked as expected"
    validations:
      required: false
  - type: textarea
    id: "additional-context"
    attributes:
      label: "Additional context"
      description: "Add any other context about the problem here. If using NeoWarp on Linux, tell us if you're using X11 or Wayland. If the issue is graphical, run NeoWarp with the following command `RUST_LOG=wgpu_core=info,wgpu_hal=info MESA_DEBUG=1 EGL_LOG_LEVEL=debug neowarp` attach relevant logs with sensitive details redacted. If `eglinfo` is already available, include its output."
    validations:
      required: false
  - type: dropdown
    id: "blocker"
    attributes:
      label: "Does this block you from using NeoWarp daily?"
      description: "All feedback will be reviewed, even if you select 'No'."
      multiple: false
      options:
        - "No"
        - "Yes, this issue prevents me from using NeoWarp daily."
    validations:
      required: true
  - type: dropdown
    id: "terminals"
    attributes:
      label: "Is this an issue only in NeoWarp?"
      description: "Verifying this issue doesn't happen in other terminals helps us to prioritize the fix"
      multiple: false
      options:
        - "Yes, I confirmed that this only happens in NeoWarp, not other terminals."
        - "No, this issue happens in NeoWarp and other terminals."
    validations:
      required: true
