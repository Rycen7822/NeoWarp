[package]
authors = ["Warp Team <dev@warp.dev>"]
default-run = "warp-oss"
description = "A local desktop terminal"
edition = "2024"
autobins = false
name = "warp"
version = "0.1.0"
publish.workspace = true
license.workspace = true

[lib]
name = "warp"
path = "src/lib.rs"

# The desktop application and its integration-test runner have separate entry points.

[[bin]]
name = "warp-oss"
path = "src/bin/oss.rs"
test = false

[[bin]]
name = "integration"
path = "src/bin/integration.rs"
test = false

[dependencies]
async-io.workspace = true
axum.workspace = true
comfy-table = "7.1.4"
inquire = "0.9.1"
diesel = { workspace = true, features = ["sqlite", "chrono"] }
diesel_migrations = { version = "2.2.0", features = ["sqlite"] }
env_logger.workspace = true
git2 = { version = "0.20.4", default-features = false, features = [
    "vendored-libgit2",
] }
http_server.workspace = true
hyper.workspace = true
libsqlite3-sys = { version = "0.33.0", features = ["bundled"] }
mio = { version = "1.1.1", features = ["os-poll", "os-ext"] }
tokio.workspace = true
tokio-util.workspace = true
warp_errors = { workspace = true, features = ["tokio-errors", "reqwest-errors"] }


notify-debouncer-full.workspace = true
rustls.workspace = true
syntect = "5.0"
sysinfo.workspace = true
warp-command-signatures = { workspace = true, features = ["embed-signatures"] }
is_executable = "1.0.1"
watcher.workspace = true
warp_files.workspace = true

addr = "0.15.6"
alphanumeric-sort = "1.5.7"
anyhow.workspace = true
arrayvec.workspace = true
asset_cache.workspace = true
asset_macro.workspace = true
async-broadcast.workspace = true
async-channel.workspace = true
async-compat.workspace = true
async-fs.workspace = true
async-recursion.workspace = true
async-stream.workspace = true
async-trait.workspace = true
base64.workspace = true
bimap = "0.6.2"
bincode.workspace = true
bitflags.workspace = true
bitflags-serde-legacy.workspace = true
blocking.workspace = true
bounded-vec-deque.workspace = true
bytecount = "0.6.9"
bytes.workspace = true
byte-unit = "5.1.4"
cfg-if.workspace = true
chrono.workspace = true
clap.workspace = true
command = { workspace = true }
command-corrections.workspace = true
crc.workspace = true
content_inspector = "0.2.4"
concat-idents.workspace = true
csv = "1.3.1"
dashmap.workspace = true
deltae = "0.3.1"
derivative.workspace = true
dhat = { version = "0.3.2", optional = true }
difflib = { git = "https://github.com/warpdotdev/difflib.git", rev = "114177e7d8e1f8017baca397f943e11644b14d63" }
directories.workspace = true
dirs.workspace = true
dunce.workspace = true
embed_plist = "1.2"
enclose = "1.1.8"
enum-iterator.workspace = true
event-listener.workspace = true
float-cmp.workspace = true
futures-lite.workspace = true
futures-util.workspace = true
futures.workspace = true
